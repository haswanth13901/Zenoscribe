services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zenoscribe
      POSTGRES_PASSWORD: zenoscribe
      POSTGRES_DB: zenoscribe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenoscribe"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    # Only backend source is bind-mounted for live-edit convenience - the
    # image's baked frontend/dist (built by the Dockerfile's frontend-build
    # stage) is deliberately left alone so it isn't shadowed by a missing or
    # stale host-side build. As a side effect, this already makes
    # recordings/ (written under voice_transcriber/) persist on the host
    # across `docker compose up`/`down` here in dev - production deploys
    # don't get this mount and need their own volume, see the README's
    # "Production" > Docker section.
    volumes:
      - ./voice_transcriber:/app/voice_transcriber
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
    command: uvicorn voice_transcriber.server:app --host 0.0.0.0 --port ${PORT:-8000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: