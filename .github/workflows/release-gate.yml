name: Release gate

# Tier 3 of the branch model (see CONTRIBUTING.md's CI section): everything
# that must be true before `main` is trusted to deploy. Runs on every PR
# into `main`, every push to `main`, and every version tag - deliberately no
# `paths:` filter (unlike ci.yml/Tier 1-2): a release PR must run the full
# gate regardless of which files it happens to touch, since a path-filtered
# required check that never fires blocks the PR forever (see the `gate` job
# below, and docs/github-repo-settings.md).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  backend-integration:
    name: Backend integration suite (Playwright)
    uses: ./.github/workflows/_backend-tests.yml
    secrets: inherit
    with:
      # All 6 test_e2e_playwright_*.py files are @pytest.mark.integration -
      # target the whole tests dir (not a single file) so admin/app/home/
      # recordings/translate page coverage actually runs, not just upload.
      pytest-args: 'voice_transcriber/tests -m integration -q'
      install-playwright: true
      job-timeout-minutes: 20
    # Deliberately gated to Tier 3 only, not every `dev` PR - see
    # nightly-e2e-dev.yml's header comment for the tradeoff (a nightly run
    # against `dev` instead) and CONTRIBUTING.md/the branch-model report for
    # why this was the chosen default rather than the alternative.

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Builds the exact two images the deploy team runs
      # (docker-compose.prod.yml's `web` and `nginx` services - see that
      # file and frontend/nginx.conf for how they're routed). `db` is the
      # stock postgres:16-alpine image, nothing to build there. A broken
      # Dockerfile - a stale COPY path, a frontend build failure, a
      # dependency that only resolves on the dev machine - previously
      # reached the deploy team as a surprise on their first deploy attempt
      # instead of failing here.
      # APP_VERSION/GIT_SHA get baked into the image (Dockerfile's app-base
      # stage) and surfaced at runtime via GET /healthz - see
      # voice_transcriber/server.py. github.ref_name is the tag name on a
      # `tags: ['v*']` push, otherwise the branch name; github.sha is
      # always the full commit SHA being built.
      - name: Build backend image
        run: |
          docker build \
            --build-arg APP_VERSION="${{ github.ref_name }}" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            -t zenoscribe-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t zenoscribe-frontend:ci .

      # Confirms non-root (Dockerfile's USER app) and that no real .env file
      # leaked into the backend image despite `COPY . /app` - .dockerignore
      # should have excluded it, this is what actually proves that. Excludes
      # .env.example/.env.production.example, which .dockerignore
      # deliberately re-includes and are meant to ship. Frontend's Dockerfile
      # only ever COPYs frontend/ into its build stage, so it has no
      # equivalent leak surface to check.
      - name: Sanity-check the backend image
        run: |
          docker run --rm zenoscribe-backend:ci whoami | grep -qx app
          leaked=$(docker run --rm zenoscribe-backend:ci sh -c \
            "ls -a /app | grep -E '^\.env' | grep -vE '^\.env\.(production\.)?example\$'" || true)
          if [ -n "$leaked" ]; then
            echo "::error::unexpected .env file(s) found inside the built image: $leaked"
            exit 1
          fi

      # pip-audit/npm audit (dependency-audit job) cover known-vuln Python/JS
      # packages; neither touches the python:3.12-slim or nginx:1.27-alpine
      # base images themselves. Trivy scans each actual built image - OS
      # packages plus both language ecosystems - for known CVEs.
      # ignore-unfixed: true so the gate doesn't go permanently red over a
      # CVE with no available patch yet.
      - name: Scan backend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'zenoscribe-backend:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

      - name: Scan frontend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'zenoscribe-frontend:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # Audits only the production dependency set (requirements.txt) - the
      # set that actually ships in the image - not requirements-dev.txt's
      # test/lint tooling, which is never deployed.
      - name: Audit Python production dependencies (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies (npm audit)
        run: |
          npm --prefix frontend ci
          npm --prefix frontend audit --audit-level=high

  prod-config-guardrails:
    name: Production config guardrails
    runs-on: ubuntu-latest
    needs: [docker-build]
    # Ordering only, not artifact reuse - `needs:` just means this doesn't
    # bother running if the base image build already failed. Each job gets
    # its own fresh runner with no access to another job's local Docker
    # image store, so this rebuilds the identical image itself below rather
    # than attempting a save/load handoff for one extra build (~1-2 min)
    # that isn't worth the added complexity.
    #
    # This proves config.py's six import-time `raise RuntimeError` guards
    # actually fire, using the real built image rather than an in-process
    # import (which is what the fast suite already covers indirectly via
    # test_cors.py's production-mode CORS test, without touching the other
    # five). A failure here means production would boot silently
    # misconfigured - this job is the single highest-value addition of the
    # whole branch-model restructure.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t zenoscribe-backend:ci .

      - name: Run guardrail matrix
        run: |
          set -u

          # Asserts `docker run` with the given -e overrides on top of a
          # deliberately-incomplete production env exits non-zero, and that
          # the failure actually names $2 (not just "some guard fired") -
          # guards against a case where a DIFFERENT guard fires first for
          # the wrong reason and this job passes without proving anything.
          # Dummy values below are throwaway literals, not secrets - never
          # sourced from repo Secrets, and never echoed beyond what
          # config.py's own error message already includes.
          assert_boot_fails() {
            description="$1"; expected_key="$2"; shift 2
            echo "::group::$description"
            set +e
            output=$(docker run --rm "$@" zenoscribe-backend:ci \
              python -c "import voice_transcriber.config" 2>&1)
            status=$?
            set -e
            echo "$output"
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              echo "::error::expected boot to FAIL for '$description' (missing/wrong $expected_key), but it exited 0"
              exit 1
            fi
            if ! echo "$output" | grep -q "$expected_key"; then
              echo "::error::boot failed for '$description' as expected, but the error didn't mention $expected_key - got: $output"
              exit 1
            fi
            echo "OK - correctly refused to boot, citing $expected_key"
          }

          # A complete, valid production env - each case below starts from
          # this and knocks out exactly one variable, so a failure can only
          # be attributed to the guard actually under test.
          COMPLETE=(
            -e ENV=production
            -e DATABASE_URL=postgresql://dummy:dummy@dummy-host:5432/dummy
            -e SONIOX_API_KEY=dummy-soniox-key
            -e STORAGE_BACKEND=minio
            -e MINIO_ACCESS_KEY=dummy-minio-access
            -e MINIO_SECRET_KEY=dummy-minio-secret
            -e REDIS_URL=redis://dummy-redis:6379/0
            -e ALLOW_TEST_HOOKS=false
          )

          assert_boot_fails "missing DATABASE_URL" "DATABASE_URL" \
            -e ENV=production \
            -e SONIOX_API_KEY=dummy-soniox-key \
            -e STORAGE_BACKEND=minio \
            -e MINIO_ACCESS_KEY=dummy-minio-access \
            -e MINIO_SECRET_KEY=dummy-minio-secret \
            -e REDIS_URL=redis://dummy-redis:6379/0

          assert_boot_fails "missing SONIOX_API_KEY" "SONIOX_API_KEY" \
            -e ENV=production \
            -e DATABASE_URL=postgresql://dummy:dummy@dummy-host:5432/dummy \
            -e STORAGE_BACKEND=minio \
            -e MINIO_ACCESS_KEY=dummy-minio-access \
            -e MINIO_SECRET_KEY=dummy-minio-secret \
            -e REDIS_URL=redis://dummy-redis:6379/0

          assert_boot_fails "STORAGE_BACKEND left at local default" "STORAGE_BACKEND" \
            -e ENV=production \
            -e DATABASE_URL=postgresql://dummy:dummy@dummy-host:5432/dummy \
            -e SONIOX_API_KEY=dummy-soniox-key \
            -e REDIS_URL=redis://dummy-redis:6379/0

          assert_boot_fails "missing MINIO_ACCESS_KEY/MINIO_SECRET_KEY" "MINIO_ACCESS_KEY" \
            -e ENV=production \
            -e DATABASE_URL=postgresql://dummy:dummy@dummy-host:5432/dummy \
            -e SONIOX_API_KEY=dummy-soniox-key \
            -e STORAGE_BACKEND=minio \
            -e REDIS_URL=redis://dummy-redis:6379/0

          assert_boot_fails "missing REDIS_URL" "REDIS_URL" \
            -e ENV=production \
            -e DATABASE_URL=postgresql://dummy:dummy@dummy-host:5432/dummy \
            -e SONIOX_API_KEY=dummy-soniox-key \
            -e STORAGE_BACKEND=minio \
            -e MINIO_ACCESS_KEY=dummy-minio-access \
            -e MINIO_SECRET_KEY=dummy-minio-secret

          assert_boot_fails "ALLOW_TEST_HOOKS enabled in production" "ALLOW_TEST_HOOKS" \
            -e ENV=production \
            -e DATABASE_URL=postgresql://dummy:dummy@dummy-host:5432/dummy \
            -e SONIOX_API_KEY=dummy-soniox-key \
            -e STORAGE_BACKEND=minio \
            -e MINIO_ACCESS_KEY=dummy-minio-access \
            -e MINIO_SECRET_KEY=dummy-minio-secret \
            -e REDIS_URL=redis://dummy-redis:6379/0 \
            -e ALLOW_TEST_HOOKS=true

          echo "::group::complete production env - must boot cleanly"
          docker run --rm "${COMPLETE[@]}" zenoscribe-backend:ci \
            python -c "import voice_transcriber.config"
          status=$?
          echo "::endgroup::"
          if [ "$status" -ne 0 ]; then
            echo "::error::a complete, valid production env still failed to import config.py - this job is testing nothing until this is fixed"
            exit 1
          fi
          echo "OK - complete production env boots cleanly"

  gate:
    name: Production gate passed
    if: always()
    needs: [backend-integration, docker-build, dependency-audit, prod-config-guardrails]
    runs-on: ubuntu-latest
    # Single required status check for `main` branch protection - see
    # docs/github-repo-settings.md. This workflow has no `paths:` filter and
    # no job-level `if:` conditionals, so unlike ci.yml's `gate`, every job
    # listed above always actually runs (never "skipped") on any push/PR
    # this workflow triggers on - but the aggregator pattern is kept
    # identical between the two files for consistency and because it's
    # cheap insurance against a future conditional job being added here.
    steps:
      - name: Verify no upstream job failed or was cancelled
        run: |
          echo "${{ join(needs.*.result, ' ') }}" \
            | tr ' ' '\n' \
            | grep -qE '^(failure|cancelled)$' && exit 1
          exit 0
