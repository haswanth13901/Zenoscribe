name: Playwright E2E Upload

on:
  push:
    paths:
      - 'voice_transcriber/**'
      - 'frontend/**'
      - '.github/workflows/playwright-e2e.yml'
      - 'requirements.txt'
  pull_request:
    paths:
      - 'voice_transcriber/**'
      - 'frontend/**'
      - '.github/workflows/playwright-e2e.yml'
      - 'requirements.txt'

jobs:
  e2e-playwright:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zenoscribe
          POSTGRES_PASSWORD: zenoscribe
          POSTGRES_DB: zenoscribe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zenoscribe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALLOW_TEST_HOOKS: 'true'
      # Provide TEST_HOOK_SECRET via repository/organization secrets. The test
      # sets its own value internally, but exporting it here keeps the job's
      # environment consistent if the test ever reads it from the environment.
      TEST_HOOK_SECRET: ${{ secrets.TEST_HOOK_SECRET }}
      DATABASE_URL: postgresql://zenoscribe:zenoscribe@localhost:5432/zenoscribe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install pinned requirements (playwright, pytest, etc. are pinned there),
          # then ensure the Playwright pytest plugin is present.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest-playwright requests

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Run Playwright E2E test
        run: python -m pytest voice_transcriber/tests/test_e2e_playwright_upload.py -m integration -q
        timeout-minutes: 20