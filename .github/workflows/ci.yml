name: CI

# Tier 1 (fast checks, ~5 min) + Tier 2 (dev-image-parity checks) - see
# CONTRIBUTING.md's CI section for the full four-tier model. Tier 1 runs on
# every push to `dev`/`main` and every PR into `dev`; Tier 2 only on `dev`
# work (see each job's own `if:`, since GitHub Actions has no
# per-job-per-branch trigger syntax - the workflow-level trigger below is
# already the union of what both tiers need).
#
# Tier 3 (release gate: docker-build, backend-integration, dependency-audit,
# prod-config-guardrails) lives in release-gate.yml instead, gated on `main`
# only - see that file for why. Tier 4 (scheduled vulnerability re-scan)
# lives in scheduled-audit.yml.
on:
  push:
    branches: [dev, main]
    paths:
      - 'voice_transcriber/**'
      - 'frontend/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.dockerignore'
      - 'scripts/**'
      - '.trivyignore'
      - '.env.example'
      - '.env.production.example'
      - '.github/dependabot.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/_backend-tests.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'voice_transcriber/**'
      - 'frontend/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.dockerignore'
      - 'scripts/**'
      - '.trivyignore'
      - '.env.example'
      - '.env.production.example'
      - '.github/dependabot.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/_backend-tests.yml'

jobs:
  backend-lint:
    name: Backend lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run flake8
        run: python -m flake8 voice_transcriber scripts --max-line-length=120

  backend-fast:
    name: Backend fast suite (pytest)
    uses: ./.github/workflows/_backend-tests.yml
    secrets: inherit
    with:
      # pytest.ini's own addopts ("-m not integration and not real_network")
      # already excludes the E2E/real-network suites - no explicit -m needed.
      pytest-args: '-q'
      install-playwright: false
      job-timeout-minutes: 10

  frontend-unit:
    name: Frontend unit tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Run Vitest suite
        run: npm --prefix frontend test
        timeout-minutes: 10

  gate:
    name: Dev checks passed
    if: always()
    needs: [backend-lint, backend-fast, frontend-unit]
    runs-on: ubuntu-latest
    # Single required status check for `dev` branch protection - see
    # docs/github-repo-settings.md. `if: always()` makes this run even when
    # an upstream job reported "skipped" rather than "success" (this
    # workflow's own `paths:` filter above means any job here can
    # legitimately never queue for a given push/PR); the grep below treats
    # "skipped" as fine but "failure"/"cancelled" as fatal. This exists
    # specifically so a conditional or path-filtered job can never leave a
    # required check stuck pending forever.
    steps:
      - name: Verify no upstream job failed or was cancelled
        run: |
          echo "${{ join(needs.*.result, ' ') }}" \
            | tr ' ' '\n' \
            | grep -qE '^(failure|cancelled)$' && exit 1
          exit 0
