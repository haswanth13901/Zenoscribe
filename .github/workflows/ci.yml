name: CI

on:
  push:
    paths:
      - 'voice_transcriber/**'
      - 'frontend/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'requirements.txt'
      - 'pytest.ini'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'voice_transcriber/**'
      - 'frontend/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'requirements.txt'
      - 'pytest.ini'
      - '.github/workflows/ci.yml'

jobs:
  backend-fast:
    name: Backend fast suite (pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zenoscribe
          POSTGRES_PASSWORD: zenoscribe
          POSTGRES_DB: zenoscribe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zenoscribe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zenoscribe:zenoscribe@localhost:5432/zenoscribe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      # -m "not integration and not real_network" is pytest.ini's default
      # (addopts), so this is every isolated unit/API test - no browser, no
      # live server subprocess, no real Soniox network calls.
      - name: Run fast suite
        run: python -m pytest -q
        timeout-minutes: 10

  backend-integration:
    name: Backend integration suite (Playwright)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zenoscribe
          POSTGRES_PASSWORD: zenoscribe
          POSTGRES_DB: zenoscribe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zenoscribe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zenoscribe:zenoscribe@localhost:5432/zenoscribe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # playwright and pytest-playwright are already pinned in
          # requirements.txt; this just makes that explicit/resilient to it
          # moving out of there later.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest-playwright requests

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      # All 6 test_e2e_playwright_*.py files are @pytest.mark.integration -
      # target the whole tests dir (not a single file) so admin/app/home/
      # recordings/translate page coverage actually runs in CI, not just
      # upload.
      - name: Run Playwright E2E tests
        run: python -m pytest voice_transcriber/tests -m integration -q
        timeout-minutes: 20

  frontend-unit:
    name: Frontend unit tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Run Vitest suite
        run: npm --prefix frontend test
        timeout-minutes: 10
