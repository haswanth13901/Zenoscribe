name: CI

# Tier 1 (fast checks, ~5 min) + Tier 2 (dev-image-parity checks) - see
# CONTRIBUTING.md's CI section for the full four-tier model. Tier 1 runs on
# every push to `dev`/`main` and every PR into `dev`; Tier 2 only on `dev`
# work (see each job's own `if:`, since GitHub Actions has no
# per-job-per-branch trigger syntax - the workflow-level trigger below is
# already the union of what both tiers need).
#
# Tier 3 (release gate: docker-build, backend-integration, dependency-audit,
# prod-config-guardrails) lives in release-gate.yml instead, gated on `main`
# only - see that file for why. Tier 4 (scheduled vulnerability re-scan)
# lives in scheduled-audit.yml.
on:
  push:
    branches: [dev, main]
    paths:
      - 'voice_transcriber/**'
      - 'frontend/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.dockerignore'
      - 'scripts/**'
      - '.trivyignore'
      - '.env.example'
      - '.env.production.example'
      - '.github/dependabot.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/_backend-tests.yml'
  pull_request:
    branches: [dev]
    # No `paths:` filter here, deliberately - unlike the `push` trigger
    # above. A path-filtered workflow never queues at all when the PR
    # touches no matching file, and GitHub treats a required status check
    # that never reports as pending forever, permanently blocking the PR
    # (see docs/github-repo-settings.md §5). A docs/governance-only PR -
    # LICENSE, CHANGELOG.md, CONTRIBUTING.md, README.md, .github/
    # templates - matches nothing in the list above and would hang with
    # `dev` branch protection enabled. Tier 1 is ~5 minutes; cheap enough
    # to run on every PR regardless of what it touches. release-gate.yml
    # omits `paths:` entirely for exactly the same reason.

jobs:
  backend-lint:
    name: Backend lint (flake8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run flake8
        run: python -m flake8 voice_transcriber scripts --max-line-length=120

  backend-fast:
    name: Backend fast suite (pytest)
    uses: ./.github/workflows/_backend-tests.yml
    secrets: inherit
    with:
      # pytest.ini's own addopts ("-m not integration and not real_network")
      # already excludes the E2E/real-network suites - no explicit -m needed.
      pytest-args: '-q'
      install-playwright: false
      job-timeout-minutes: 10

  frontend-unit:
    name: Frontend unit tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      # Prettier only - ESLint is deliberately not installed. tsc -b's
      # strict/noUnusedLocals/noUnusedParameters plus this Prettier gate
      # cover most of what a linter would flag here; the one real gap is
      # eslint-plugin-react-hooks. docs/frontend.md's "Linting (ESLint)"
      # section documents that trade-off and carries verified install steps
      # (Babel's parser, not typescript-eslint, which cannot run against
      # TypeScript 7) for whenever it's wanted - including the two lines to
      # add here.
      #
      # This step is what gates frontend formatting: `format:check` sat in
      # package.json unused from the day the frontend was set up, leaving
      # drift ungated on a codebase the backend's flake8 job holds to a
      # stricter standard. Runs before the test suite so a formatting
      # failure doesn't wait on ~40s of Vitest.
      - name: Check formatting (Prettier)
        run: npm --prefix frontend run format:check

      - name: Run Vitest suite
        run: npm --prefix frontend test
        timeout-minutes: 10

  config-validate:
    name: Validate compose files & env templates
    runs-on: ubuntu-latest
    # No Docker image build, no services: block - just parses YAML/env, so
    # this stays in Tier 1 despite touching Docker/env concerns. Catches gap
    # 5/7 from the branch-model audit: neither compose file was ever
    # validated, and the two .env templates could silently drift from
    # config.py's actual requirements.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `docker compose config` also needs the `env_file:` target to
      # physically exist (a hard file-existence check, separate from - and
      # not satisfied by - `${VAR}` substitution) - the .example files are
      # exactly what a fresh clone has, so copy them to the real filenames
      # Compose expects. Placeholder values only, identical to the .example
      # content; never a real secret, and this never leaves the ephemeral
      # CI runner.
      - name: Stage placeholder env files for Compose to read
        run: |
          cp .env.example .env
          cp .env.production.example .env.production

      - name: Validate docker-compose.yml (dev)
        run: docker compose -f docker-compose.yml config -q

      - name: Validate docker-compose.prod.yml (prod)
        # --env-file is what fills in ${POSTGRES_USER} etc. inside the YAML
        # itself - a separate mechanism from the env_file: staging above.
        # See docker-compose.prod.yml's own header comment for why both are
        # needed and why they're not the same thing.
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config -q

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check .env templates match config.py's fail-fast requirements
        run: python scripts/check_env_templates.py

  dev-image-build:
    name: Dev image build (backend-with-frontend + frontend dev stage)
    runs-on: ubuntu-latest
    # Tier 2: only meaningful for dev-branch work, not a production push -
    # release-gate.yml's docker-build job already covers the prod targets
    # (Dockerfile's default `backend` target, frontend/Dockerfile's nginx
    # stage) on every main push/PR. Before this job existed, NEITHER dev
    # target (backend-with-frontend, frontend/Dockerfile's `dev` stage) was
    # ever built by CI at all - both could break silently.
    #
    # This `if:` is what makes this job Tier 2 instead of Tier 1 despite
    # living in the same trigger scope as the jobs above: on a `main` push
    # (which this workflow's own triggers also match, for Tier 1's sake)
    # this evaluates false and the job reports "skipped" - the gate job
    # below treats that as acceptable, not a required-check trap (see that
    # job's comment).
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build dev backend image (backend-with-frontend target)
        run: docker build --target backend-with-frontend -t zenoscribe-backend-dev:ci .

      - name: Build dev frontend image (Vite dev-server stage)
        run: docker build -f frontend/Dockerfile --target dev -t zenoscribe-frontend-dev:ci .

      - name: Confirm the dev backend image has the baked SPA
        run: docker run --rm zenoscribe-backend-dev:ci test -f /app/frontend/dist/index.html

      - name: Confirm the dev backend image still runs non-root
        run: docker run --rm zenoscribe-backend-dev:ci whoami | grep -qx app
        # No Trivy scan here, deliberately - see this file's header comment:
        # neither dev image ships, so scanning them only doubles this job's
        # runtime to gate an artifact nobody deploys. Tier 3's docker-build
        # job already Trivy-scans the two images that actually ship.

  gate:
    name: Dev checks passed
    if: always()
    needs: [backend-lint, backend-fast, frontend-unit, config-validate, dev-image-build]
    runs-on: ubuntu-latest
    # Single required status check for `dev` branch protection - see
    # docs/github-repo-settings.md. `if: always()` makes this run even when
    # an upstream job reported "skipped" rather than "success":
    # dev-image-build's own `if:` evaluates false on a `main` push and
    # reports "skipped", not "success". The grep below treats "skipped" as
    # acceptable but "failure"/"cancelled" as fatal, so a conditional job
    # can never leave a required check stuck pending forever.
    steps:
      - name: Verify no upstream job failed or was cancelled
        run: |
          echo "${{ join(needs.*.result, ' ') }}" \
            | tr ' ' '\n' \
            | grep -qE '^(failure|cancelled)$' && exit 1
          exit 0