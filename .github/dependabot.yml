version: 2

# Every entry below targets `dev`, not `main` (the repo default) - dependency
# PRs land in dev like any other change and reach main only through a
# release PR (dev -> main), never bumping main directly out from under
# whatever's about to be deployed. See CONTRIBUTING.md's "Release flow".
updates:
  # requirements.txt (production) and requirements-dev.txt (test/lint tooling)
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # frontend/package.json - React + Redux Toolkit SPA
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # Base images pinned in Dockerfile (python:3.12-slim, node:20-slim) -
  # CI's Trivy scan (docker-build job) catches CVEs in whatever's currently
  # pinned; this opens the PR to bump the pin itself.
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    ignore:
      # Node 25 is odd-numbered and never becomes LTS - it goes EOL within
      # months of release. Holding at 20 (still in maintenance) and moving
      # straight to 26 when that reaches LTS. Without this rule, closing the
      # 25.x PR just has Dependabot reopen it on the next weekly scan.
      # Decision recorded on issue #26.
      - dependency-name: "node"
        versions: ["25.x"]

  # Base images pinned in frontend/Dockerfile (node:20-slim,
  # nginx:1.31-alpine) - Dependabot's docker ecosystem only looks in the
  # exact directory given, not recursively, so this needs its own entry
  # separate from the root Dockerfile above.
  - package-ecosystem: "docker"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    ignore:
      # Same as the root Dockerfile entry above - both images move to Node 26
      # together, never one at a time. See issue #26.
      - dependency-name: "node"
        versions: ["25.x"]

  # Actions pinned across .github/workflows/*.yml (actions/checkout,
  # actions/setup-python, aquasecurity/trivy-action, etc).
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"