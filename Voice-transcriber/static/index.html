<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zenoscribe</title>
<style>
  :root {
    --bg: #0e0f13; --panel: #16181f; --line: #262932;
    --text: #e6e8ee; --muted: #8b90a0;
    --u1: #6ea8fe; --u2: #7ddba3; --u3: #f0a868; --u4: #d08fe0;
    --rec: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px;
  }
  h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  .spacer { flex: 1; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 8px 16px; border-radius: 7px; font: inherit; font-size: 14px;
    cursor: pointer; transition: .15s;
  }
  button:hover:not(:disabled) { border-color: #3a3f4d; }
  button:disabled { opacity: .4; cursor: default; }
  button.rec { background: var(--rec); border-color: var(--rec); color: #fff; }
  #status { font-size: 13px; color: var(--muted); }
  #status.live::before {
    content: ''; display: inline-block; width: 7px; height: 7px;
    background: var(--rec); border-radius: 50%; margin-right: 7px;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 50% { opacity: .3; } }
  main { flex: 1; overflow-y: auto; padding: 22px; }
  #transcript { max-width: 780px; margin: 0 auto; }
  .turn {
    display: flex; gap: 12px; padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,.04);
  }
  .who {
    flex: 0 0 66px; font-size: 12px; font-weight: 600;
    letter-spacing: .3px; padding-top: 2px;
  }
  .turn[data-s="user-1"] .who { color: var(--u1); }
  .turn[data-s="user-2"] .who { color: var(--u2); }
  .turn[data-s="user-3"] .who { color: var(--u3); }
  .turn[data-s="user-4"] .who { color: var(--u4); }
  .body { flex: 1; }
  .ts { font-size: 11px; color: var(--muted); margin-left: 8px; }
  .partial .body { color: #b9becd; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; font-size: 14px; }
  .who { font-size: 13px; color: var(--muted); }
  #drawer {
    position: fixed; top: 0; right: 0; width: 380px; max-width: 90vw;
    height: 100vh; background: var(--panel); border-left: 1px solid var(--line);
    padding: 16px; overflow-y: auto; z-index: 10;
  }
  .dhead { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; }
  .rec { border: 1px solid var(--line); border-radius: 8px;
    padding: 11px; margin-bottom: 9px; }
  .rec .meta { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .rec .prev { font-size: 13px; margin-bottom: 9px; }
  .rec .acts { display: flex; gap: 6px; }
  .rec button { padding: 5px 10px; font-size: 12px; }
  .dfilters { display: flex; gap: 10px; align-items: flex-end;
    margin-bottom: 14px; flex-wrap: wrap; }
  .dfilters label { display: block; font-size: 11px; color: var(--muted);
    margin-bottom: 4px; }
  .dfilters input[type=date] { background: #0e0f13; border: 1px solid var(--line);
    color: var(--text); padding: 7px 9px; border-radius: 6px; font: inherit;
    font-size: 13px; color-scheme: dark; }
  .dfilters button { padding: 7px 12px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>Zenoscribe</h1>
  <span id="status">idle</span>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button id="adminBtn" hidden onclick="location.href='/admin'">Admin</button>
  <button id="histBtn">My recordings</button>
  <button id="out">Sign out</button>
  <button id="clear">Clear</button>
  <button id="save">Save</button>
  <button id="toggle">Start</button>
</header>

<main><div id="transcript"><div class="empty">Press Start and speak.</div></div></main>

<aside id="drawer" hidden>
  <div class="dhead">
    <strong>My recordings</strong>
    <button id="dclose">Close</button>
  </div>
  <div class="dfilters">
    <div>
      <label>From</label>
      <input type="date" id="dfrom">
    </div>
    <div>
      <label>To</label>
      <input type="date" id="dto">
    </div>
    <button id="dclear">Clear</button>
  </div>
  <div id="dlist"></div>
</aside>

<script>
const $ = s => document.querySelector(s);
const transcript = $('#transcript'), statusEl = $('#status'), toggle = $('#toggle');

const token = sessionStorage.getItem('token');
const me = JSON.parse(sessionStorage.getItem('user') || 'null');
if (!token || !me) location.href = '/login';
if (me) {
  $('#who').textContent = me.username;
  if (me.role === 'admin') $('#adminBtn').hidden = false;
}

let ws, ctx, node, stream, running = false;
let partialEl = null;
const turns = [];

function clearEmpty() {
  const e = transcript.querySelector('.empty');
  if (e) e.remove();
}

function scrollDown() {
  const m = transcript.parentElement;
  m.scrollTop = m.scrollHeight;
}

function addTurn(speaker, text, start) {
  clearEmpty();
  if (partialEl) { partialEl.remove(); partialEl = null; }

  const div = document.createElement('div');
  div.className = 'turn';
  div.dataset.s = speaker;
  const ts = start != null ? `<span class="ts">${start.toFixed(1)}s</span>` : '';
  div.innerHTML = `<div class="who">${speaker}</div><div class="body">${escapeHtml(text)}${ts}</div>`;
  transcript.appendChild(div);
  scrollDown();

  turns.push({ speaker, text, start });
}

// Replaces the live line each frame. Soniox resends the full hypothesis,
// so appending would duplicate words.
function showPartial(speaker, text) {
  clearEmpty();
  if (!partialEl) {
    partialEl = document.createElement('div');
    partialEl.className = 'turn partial';
    transcript.appendChild(partialEl);
  }
  partialEl.dataset.s = speaker;
  partialEl.innerHTML =
    `<div class="who">${speaker}</div><div class="body">${escapeHtml(text)}</div>`;
  scrollDown();
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function start() {
  statusEl.textContent = 'connecting';

  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true,
             noiseSuppression: true, autoGainControl: false }
  });

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = async () => {
    try {
      ctx = new AudioContext();
      await ctx.audioWorklet.addModule('/static/pcm-worklet.js');
      node = new AudioWorkletNode(ctx, 'pcm-worklet');
      ctx.createMediaStreamSource(stream).connect(node);
      node.port.onmessage = e => {
        if (ws.readyState === WebSocket.OPEN) ws.send(e.data);
      };
      running = true;
      toggle.textContent = 'Stop';
      toggle.classList.add('rec');
      statusEl.textContent = 'listening';
      statusEl.className = 'live';
    } catch (err) {
      statusEl.textContent = 'audio setup failed: ' + err.message;
      stop();
    }
  };

  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'final') {
      addTurn(m.speaker, m.text, m.start);
    } else if (m.type === 'partial') {
      showPartial(m.speaker, m.text);
    } else if (m.type === 'error') {
      statusEl.textContent = 'error: ' + m.message;
    }
  };

  ws.onclose = ev => {
    if (ev.code === 4401) {
      sessionStorage.clear();
      location.href = '/login';
      return;
    }
    if (running) stop();
  };
  ws.onerror = () => { statusEl.textContent = 'connection failed'; stop(); };
}

function stop() {
  running = false;
  if (node) node.disconnect();
  if (ctx) ctx.close();
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (ws && ws.readyState === WebSocket.OPEN) ws.close();
  if (partialEl) { partialEl.remove(); partialEl = null; }
  toggle.textContent = 'Start';
  toggle.classList.remove('rec');
  statusEl.textContent = 'stopped';
  statusEl.className = '';
}

toggle.onclick = () => running ? stop() : start().catch(err => {
  statusEl.textContent = 'mic error: ' + err.message;
});

$('#clear').onclick = () => {
  turns.length = 0;
  transcript.innerHTML = '<div class="empty">Press Start and speak.</div>';
  partialEl = null;
};

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + token, ...(opts.headers || {}) } });
  if (r.status === 401) { sessionStorage.clear(); location.href = '/login'; return; }
  const d = r.status === 204 ? null : await r.json();
  if (!r.ok) throw new Error((d && d.detail) || 'Request failed');
  return d;
}

const fmtDur = s => { s = Math.round(s || 0);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

async function loadHistory() {
  const list = $('#dlist');
  list.innerHTML = '<div class="empty">Loading...</div>';
  try {
    const p = new URLSearchParams();
    if ($('#dfrom').value) p.set('date_from', $('#dfrom').value);
    if ($('#dto').value) p.set('date_to', $('#dto').value);
    const qs = p.toString();
    const rows = await api('/api/recordings' + (qs ? '?' + qs : ''));
    if (!rows.length) { list.innerHTML = '<div class="empty">No recordings yet.</div>'; return; }
    list.innerHTML = rows.map(r => `
      <div class="rec">
        <div class="meta">${new Date(r.started_at).toLocaleString()}
          &middot; ${fmtDur(r.duration)} &middot; ${r.turn_count} turns</div>
        <div class="prev">${escapeHtml(r.preview || '(no speech detected)')}</div>
        <div class="acts">
          <button onclick="dl('${r.id}','txt')">Transcript</button>
          <button onclick="dl('${r.id}','wav')">Audio</button>
          <button onclick="delRec('${r.id}')">Delete</button>
        </div>
      </div>`).join('');
  } catch (e) { list.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`; }
}

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

async function dl(id, kind) {
  try {
    if (kind === 'txt') {
      const d = await api(`/api/recordings/${id}/transcript`);
      saveBlob(new Blob([d.text], { type: 'text/plain' }), `${id}.txt`);
    } else {
      const r = await fetch(`/api/recordings/${id}/audio`,
        { headers: { 'Authorization': 'Bearer ' + token } });
      if (!r.ok) throw new Error('Download failed');
      saveBlob(await r.blob(), `${id}.wav`);
    }
  } catch (e) { alert(e.message); }
}

async function delRec(id) {
  if (!confirm('Delete this recording?')) return;
  try { await api(`/api/recordings/${id}`, { method: 'DELETE' }); loadHistory(); }
  catch (e) { alert(e.message); }
}

$('#histBtn').onclick = () => { $('#drawer').hidden = false; loadHistory(); };
$('#dfrom').onchange = loadHistory;
$('#dto').onchange = loadHistory;
$('#dclear').onclick = () => {
  $('#dfrom').value = ''; $('#dto').value = ''; loadHistory();
};
$('#dclose').onclick = () => { $('#drawer').hidden = true; };
$('#out').onclick = () => { sessionStorage.clear(); location.href = '/login'; };

$('#save').onclick = () => {
  if (!turns.length) return;
  const text = turns.map(t =>
    `[${(t.start ?? 0).toFixed(1)}s] ${t.speaker}: ${t.text}`).join('\n');
  const url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = `transcript-${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
};
</script>
</body>
</html>
