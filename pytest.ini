[pytest]
markers =
    integration: end-to-end / integration tests that start a real server subprocess
    real_network: tests that make a real outbound network call and/or require live credentials (e.g. SONIOX_API_KEY)
addopts = -m "not integration and not real_network" --cov=voice_transcriber --cov-report=term-missing --cov-fail-under=60
asyncio_mode = auto