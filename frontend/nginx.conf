# This container is now the whole edge: TLS termination, routing between
# itself and `web`, security headers, gzip, the request-body cap, and
# static-file serving for the SPA/login page - previously split between
# `caddy` (edge) and this container (static files only). See
# DEPLOYMENT.md's "Open decision - replacing Caddy with nginx" section
# (now resolved) for the history, and scripts/init-letsencrypt.sh for how
# the certificate this file references gets there in the first place.
#
# Replace the placeholder domain below (both server_name lines and the
# ssl_certificate paths) with your real one - same manual-edit pattern the
# old Caddyfile used, not env-var templating: this file already relies on
# nginx's own `$host`/`$http_upgrade`/etc. variables, and templating just
# `$DOMAIN` in on top risks a substitution tool mangling those too.

# ---- Port 80: ACME challenge only, everything else redirects to HTTPS ----
server {
    listen 80;
    server_name your-domain.example.com;

    # certbot (see scripts/init-letsencrypt.sh and the `certbot` Compose
    # service) writes its HTTP-01 challenge files into this shared volume;
    # nginx just needs to serve them back out over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Docker healthcheck target (docker-compose.prod.yml's `nginx`
    # service) - deliberately plain HTTP, not routed through the HTTPS
    # redirect below. Keeps the healthcheck a simple `wget --spider`
    # against a fixed 200, with no dependency on the container's wget
    # build supporting TLS/self-signed certs - TLS correctness itself is
    # proven separately, by DEPLOYMENT.md's real end-to-end gate check.
    location = /healthz-nginx {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Port 443: TLS, routing, headers, static files ----
server {
    listen 443 ssl;
    server_name your-domain.example.com;
    root /usr/share/nginx/html;

    ssl_certificate /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;

    # Mozilla "Intermediate" baseline - Caddy defaults to modern-safe
    # automatically, nginx does not, so this has to be spelled out.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Slightly above config.MAX_UPLOAD_MB (20MB) so the app's own limit is
    # always what actually rejects an oversized upload - a 413 from the app
    # includes a clear message; a request nginx itself refuses does not.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # FastAPI has zero add_middleware() calls for security headers - this
    # is the only place any of these are set. `always` so they're sent on
    # error responses too, not just 2xx. frame-ancestors 'none' is the
    # modern replacement for X-Frame-Options above (kept both for older
    # browser coverage); connect-src 'self' covers this same-origin app's
    # own /ws and /ws/translate WebSocket connections; script-src 'self'
    # is what login.html's external login.js needs (see login.html and
    # login.js - no inline script left, so no 'unsafe-inline' needed here).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'" always;

    # Live sessions (recording, translation) hold a WebSocket open for the
    # length of a meeting. nginx's default proxy timeouts would silently
    # cut a long recording mid-sentence - that looks exactly like an app
    # bug from the browser side, so they're disabled here, not left at
    # nginx's defaults. proxy_http_version 1.1 is required for the
    # Upgrade/Connection handshake to work at all.
    location = /ws {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 0;
        proxy_send_timeout 0;
    }

    location = /ws/translate {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 0;
        proxy_send_timeout 0;
    }

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything below mirrors voice_transcriber/server.py's page-serving
    # routes exactly, one by one, rather than a blanket SPA
    # `try_files $uri /index.html` fallback - server.py never had a
    # catch-all either (an unknown path 404s), and the app's own
    # client-side catch-all (main.tsx's `<Route path="*">`) only helps
    # once one of these six routes has already loaded the SPA shell.

    # / and /login both serve the still-vanilla login page (see the repo
    # README's "Frontend" section) - matches server.py's root()/login_page().
    location = / {
        try_files /login.html =404;
    }

    location = /login {
        try_files /login.html =404;
    }

    # The six client-side routes of the React SPA - all serve the same
    # built shell; react-router decides what renders. Both the bare and
    # trailing-slash forms are listed directly (matching server.py) so a
    # stray slash doesn't need an extra redirect.
    location ~ ^/(home|app|admin|translate|recordings|upload)/?$ {
        try_files /index.html =404;
    }

    # Registered from "/" (not /static/) so its default scope covers the
    # whole app - a service worker's scope is capped at the directory it's
    # served from. Matches server.py's dedicated /service-worker.js route,
    # including both response headers.
    location = /service-worker.js {
        try_files /service-worker.js =404;
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache" always;
    }

    # Vite's production build (base: "/static/") - every hashed bundle
    # asset and every public/ file (theme.css, theme-preboot.js,
    # pcm-worklet.js, manifest.webmanifest, icons/, login.js) is
    # referenced under this prefix, all physically sitting at the root of
    # dist/ - matches server.py's NoCacheStaticFiles mount exactly,
    # including forcing revalidation on every request rather than letting
    # browsers cache a stale JS/CSS file after a deploy.
    location /static/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "no-cache" always;
    }
}
