# Mirrors voice_transcriber/server.py's page-serving routes (root, /login,
# the six SPA routes, /service-worker.js, the /static mount) exactly, one
# by one, rather than a blanket SPA `try_files $uri /index.html` fallback -
# server.py never had a catch-all either (an unknown path 404s), and the
# app's own client-side catch-all (main.tsx's `<Route path="*">`) only
# helps once one of these six routes has already loaded the SPA shell.
#
# API/WS requests (/api/*, /ws, /ws/translate, /healthz) never reach this
# container - Caddy routes those straight to `web` instead (see
# ../Caddyfile) - so nothing here needs to know about them.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # / and /login both serve the still-vanilla login page (see the repo
    # README's "Frontend" section) - matches server.py's root()/login_page().
    location = / {
        try_files /login.html =404;
    }

    location = /login {
        try_files /login.html =404;
    }

    # The six client-side routes of the React SPA - all serve the same
    # built shell; react-router decides what renders. Both the bare and
    # trailing-slash forms are listed directly (matching server.py) so a
    # stray slash doesn't need an extra redirect.
    location ~ ^/(home|app|admin|translate|recordings|upload)/?$ {
        try_files /index.html =404;
    }

    # Registered from "/" (not /static/) so its default scope covers the
    # whole app - a service worker's scope is capped at the directory it's
    # served from. Matches server.py's dedicated /service-worker.js route,
    # including both response headers.
    location = /service-worker.js {
        try_files /service-worker.js =404;
        add_header Service-Worker-Allowed "/" always;
        add_header Cache-Control "no-cache" always;
    }

    # Vite's production build (base: "/static/") - every hashed bundle
    # asset and every public/ file (theme.css, theme-preboot.js,
    # pcm-worklet.js, manifest.webmanifest, icons/) is referenced under
    # this prefix, all physically sitting at the root of dist/ - matches
    # server.py's NoCacheStaticFiles mount exactly, including forcing
    # revalidation on every request rather than letting browsers cache a
    # stale JS/CSS file after a deploy.
    location /static/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "no-cache" always;
    }
}
