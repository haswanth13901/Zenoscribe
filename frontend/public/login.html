<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Zenoscribe</title>
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
    <link rel="icon" href="/static/icons/favicon-32.png" />
    <meta name="theme-color" content="#f6f7f9" />
    <style>
      :root {
        --navy: #0d1b2e;
        --navy-line: #1c2c44;
        --muted-on-navy: #94a6c2;
        --dim-on-navy: #6d7f9c;
        --accent: #1f5fd6;
        --accent-bright: #4f7fe8;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --line: #e3e7ee;
        --text: #0f1e33;
        --muted: #8a94a4;
        --field-border: #d5dbe5;
        --err-bg: #fdecea;
        --err: #b02f27;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        color: var(--text);
        font:
          15px/1.55 ui-sans-serif,
          system-ui,
          -apple-system,
          "Helvetica Neue",
          sans-serif;
      }
      .split {
        min-height: 100vh;
        display: flex;
      }

      /* ---- left: brand panel ---- */
      .left {
        flex: 1 1 50%;
        background: var(--navy);
        color: #fff;
        padding: 40px 48px;
        display: flex;
        flex-direction: column;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      .brand .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent-bright);
        flex: none;
      }
      .hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 440px;
      }
      .hero h1 {
        font-size: 34px;
        line-height: 1.28;
        font-weight: 700;
        margin: 0 0 16px;
      }
      .hero p {
        font-size: 14.5px;
        line-height: 1.6;
        color: var(--muted-on-navy);
        margin: 0;
      }
      .status {
        font-size: 12.5px;
        color: var(--dim-on-navy);
      }

      /* ---- right: form panel ---- */
      .right {
        flex: 1 1 50%;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .form-card {
        width: 100%;
        max-width: 380px;
      }
      .form-card h2 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        font-size: 13.5px;
        margin-bottom: 26px;
      }
      label {
        display: block;
        font-size: 12.5px;
        color: var(--muted);
        margin: 16px 0 6px;
      }
      input {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--field-border);
        color: var(--text);
        padding: 11px 12px;
        border-radius: 8px;
        font: inherit;
        font-size: 14px;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(31, 95, 214, 0.12);
      }
      button {
        width: 100%;
        margin-top: 24px;
        background: var(--accent);
        color: #fff;
        border: 0;
        padding: 12px;
        border-radius: 8px;
        font: inherit;
        font-size: 14.5px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #1a52c0;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .err {
        color: var(--err);
        background: var(--err-bg);
        font-size: 13px;
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 8px;
        display: none;
      }
      .err.show {
        display: block;
      }

      @media (max-width: 860px) {
        .split {
          flex-direction: column;
        }
        .left {
          padding: 32px;
        }
        .hero {
          max-width: none;
        }
        .hero h1 {
          font-size: 26px;
        }
        .status {
          margin-top: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="split">
      <div class="left">
        <div class="brand"><span class="dot"></span><span>ZENOSCRIBE</span></div>
        <div class="hero">
          <h1>Every conversation, captured in the language each person needs.</h1>
          <p>
            Sessions stay on your account. Audio and transcript download as WAV and TXT any time.
          </p>
        </div>
        <div class="status">Status: all systems operational</div>
      </div>

      <div class="right">
        <div class="form-card">
          <h2>Welcome back</h2>
          <div class="sub">Sign in to continue</div>

          <label for="u">Username</label>
          <input id="u" autocomplete="username" autofocus />

          <label for="p">Password</label>
          <input id="p" type="password" autocomplete="current-password" />

          <button id="go">Sign in</button>
          <div class="err" id="err"></div>
        </div>
      </div>
    </div>

    <script src="/static/login.js"></script>
  </body>
</html>
