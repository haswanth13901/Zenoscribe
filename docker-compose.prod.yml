# Production Compose file - single VM, behind Caddy.
#
# Four services, three separately-built/pulled images:
#   db        stock postgres:16-alpine, no custom Dockerfile
#   web       backend only (Dockerfile's default `backend` target) - API/WS
#             routes, nothing else. Built from the repo root.
#   frontend  the SPA/login page, built and served by nginx
#             (frontend/Dockerfile). Built from the repo root too (needs
#             frontend/ from that context), just a different Dockerfile.
#   caddy     TLS termination + routing between `web` and `frontend` - see
#             Caddyfile for exactly which paths go where.
#
# Differences from docker-compose.yml (dev-only, left untouched, and a
# single combined web container there - see that file's own comments):
#   - no source bind-mounts; runs whatever was baked into the image at build
#   - env_file: .env.production instead of .env
#   - Postgres credentials come from the environment, not literals
#   - Neither `web` nor `frontend` is published to the host at all
#     (`expose:` only) - Caddy is the only public entry point. See
#     Caddyfile.
#   - named volumes for both pgdata and recordings, so `down`/`up` and image
#     upgrades don't lose data
#   - per-service log rotation, so container logs can't fill the disk
#
# Usage:
#   cp .env.production.example .env.production   # then fill in real values
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# The top-level `--env-file` flag is required, and is NOT the same thing as
# `web`'s `env_file:` line below. `--env-file` controls what Compose
# substitutes for `${POSTGRES_USER}` etc. *inside this YAML file itself*
# (Compose only reads its own default `.env` for that otherwise, never an
# env_file: entry); `env_file:` controls what gets injected into the `web`
# container's process environment at runtime. Both need to point at
# .env.production, for different reasons - see DEPLOYMENT.md.
#
# See the README's "Production" section and DEPLOYMENT.md for the full
# runbook (first boot, backups, restart behaviour, rollback).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  web:
    # Backend-only image (Dockerfile's default `backend` target - no
    # frontend baked in). The frontend is the separate `frontend` service
    # below; Caddy routes between the two - see Caddyfile.
    build: .
    env_file:
      - .env.production
    environment:
      # DATABASE_URL is composed here from the same POSTGRES_* vars given to
      # `db` above, so the two never drift apart. Put POSTGRES_USER/
      # POSTGRES_PASSWORD/POSTGRES_DB and everything else (SONIOX_API_KEY,
      # JWT_SECRET, ADMIN_PASSWORD, ...) in .env.production - see
      # .env.production.example.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    expose:
      - "8000"
    volumes:
      - recordings:/app/voice_transcriber/recordings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/login.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - web
      - frontend
    logging: *default-logging

volumes:
  pgdata:
  recordings:
  caddy_data:
  caddy_config:
