<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Zenoscribe</title>
<style>
  :root{
    --bg:#0e0f13;--panel:#16181f;--line:#262932;
    --text:#e6e8ee;--muted:#8b90a0;--accent:#6ea8fe;
    --ok:#7ddba3;--warn:#f0a868;--err:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,sans-serif;
    height:100vh;overflow:hidden;display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px}
  h1{font-size:15px;font-weight:600;margin:0}
  .spacer{flex:1}
  .who{font-size:13px;color:var(--muted)}
  button{background:var(--panel);color:var(--text);border:1px solid var(--line);
    padding:7px 14px;border-radius:7px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{border-color:#3a3f4d}
  button.primary{background:var(--accent);color:#0b1220;border-color:var(--accent);font-weight:600}
  button.danger{color:var(--err);border-color:#3a2830}
  .tabs{display:flex;justify-content:flex-end;gap:6px;padding:12px 20px 0}
  .tabs button{border-radius:7px 7px 0 0}
  .tabs button.on{background:var(--panel);border-bottom-color:var(--panel);color:var(--accent)}
  main{flex:1;overflow-y:auto;padding:18px 20px 40px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;letter-spacing:.4px;text-transform:uppercase;
    color:var(--muted);padding:8px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line)}
  .tag.admin{color:var(--warn);border-color:#3d3222}
  .tag.on{color:var(--ok);border-color:#24382c}
  .tag.off{color:var(--muted)}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
  input,select{width:100%;background:#0e0f13;border:1px solid var(--line);color:var(--text);
    padding:9px 11px;border-radius:7px;font:inherit;font-size:14px}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .msg{margin-top:12px;font-size:13px;min-height:18px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  .muted{color:var(--muted)}
  .preview{color:var(--muted);font-size:13px;max-width:420px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  h2{font-size:13px;margin:0 0 14px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.4px}
  .empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
  .dot.off{background:#3a3f4d}
  .filters{display:flex;gap:14px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap}
  .filters > div{min-width:150px}
  .filter-actions{display:flex;gap:8px;min-width:auto}
  .filters input[type=date]{color-scheme:dark}
</style>
</head>
<body>

<header id="appHeader">
  <span class="spacer"></span>
  <span class="who" id="who"></span>
</header>

<div id="featureStaging" hidden>
  <button id="uploadBtn">Upload</button>
</div>

<nav class="tabs">
  <button id="tabUsers" class="on">Users</button>
  <button id="tabRecs">All Recordings</button>
</nav>

<main>
  <section id="paneUsers">
    <div class="panel" style="margin-bottom:16px">
      <h2>Register a user</h2>
      <div class="grid">
        <div><label>Username</label><input id="nu"></div>
        <div><label>Full name</label><input id="nf"></div>
        <div><label>Email</label><input id="ne" type="email"></div>
        <div><label>Password (min 8)</label><input id="np" type="password"></div>
        <div><label>Role</label>
          <select id="nr"><option value="user">User</option><option value="admin">Admin</option></select>
        </div>
      </div>
      <div style="margin-top:14px"><button class="primary" id="create">Create user</button></div>
      <div class="msg" id="cmsg"></div>
    </div>

    <div class="panel">
      <h2>Users</h2>
      <table>
        <thead><tr>
          <th>User</th><th>Email</th><th>Role</th><th>Status</th>
          <th>Recordings</th><th>Presence</th><th>Last login</th><th></th>
        </tr></thead>
        <tbody id="ubody"></tbody>
      </table>
    </div>
  </section>

  <section id="paneRecs" hidden>
    <div class="panel">
      <h2>All recordings</h2>
      <div class="filters">
        <div>
          <label>Filter by user</label>
          <select id="filter"><option value="">All users</option></select>
        </div>
        <div>
          <label>From</label>
          <input type="date" id="from">
        </div>
        <div>
          <label>To</label>
          <input type="date" id="to">
        </div>
        <div class="filter-actions">
          <button onclick="loadRecs()">Apply</button>
          <button onclick="clearFilters()">Clear</button>
        </div>
      </div>
      <table>
        <thead><tr>
          <th>When</th><th>User</th><th>Length</th><th>Turns</th>
          <th>Preview</th><th></th>
        </tr></thead>
        <tbody id="rbody"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const token = sessionStorage.getItem('token');
const me = JSON.parse(sessionStorage.getItem('user') || 'null');

// Auth gate. Use replace() so the guarded page isn't left in history (which
// can otherwise produce a back-button redirect loop), and stop() to halt the
// rest of the script the moment we decide to leave.
if (!token || !me) {
  location.replace('/login');
  throw new Error('redirecting to login');
}
if (me.role !== 'admin') {
  location.replace('/app');
  throw new Error('redirecting to app');
}
$('#who').textContent = `${me.username} (admin)`;

async function api(path, opts = {}) {
  const r = await fetch(path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token,
      ...(opts.headers || {})
    }
  });
  if (r.status === 401) { sessionStorage.clear(); location.href = '/login'; return; }
  const data = r.status === 204 ? null : await r.json();
  if (!r.ok) throw new Error((data && data.detail) || 'Request failed');
  return data;
}

const esc = s => String(s ?? '').replace(/[&<>\"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jsEsc = s => String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'\\r');

const fmtDate = iso => {
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleString();
};
const fmtDur = s => {
  s = Math.round(s || 0);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};

const ONLINE_MINUTES = 5;

function sinceText(iso) {
  const secs = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (secs < 60) return 'just now';
  const m = Math.floor(secs / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  return `${d}d ago`;
}

function presence(lastSeen) {
  if (!lastSeen) return '<span class="dot off"></span><span class="muted">never</span>';
  const mins = (Date.now() - new Date(lastSeen)) / 60000;
  if (mins < ONLINE_MINUTES) {
    return '<span class="dot on"></span>online';
  }
  return `<span class="dot off"></span><span class="muted">${sinceText(lastSeen)}</span>`;
}

let users = [];

async function loadUsers() {
  users = await api('/api/admin/users');
  $('#ubody').innerHTML = users.map(u => `
    <tr>
      <td><strong>${esc(u.username)}</strong>${u.full_name
          ? `<div class="muted" style="font-size:12px">${esc(u.full_name)}</div>` : ''}</td>
      <td class="muted">${esc(u.email) || '—'}</td>
      <td><span class="tag ${u.role === 'admin' ? 'admin' : ''}">${esc(u.role)}</span></td>
      <td><span class="tag ${u.is_active ? 'on' : 'off'}">${u.is_active ? 'active' : 'disabled'}</span></td>
      <td>${u.recording_count}</td>
      <td>${presence(u.last_seen)}</td>
      <td class="muted" style="font-size:13px">${fmtDate(u.last_login)}</td>
      <td><div class="row-actions">
        <button onclick="resetPw('${jsEsc(u.id)}','${jsEsc(u.username)}')">Reset password</button>
        <button onclick="toggle('${jsEsc(u.id)}',${u.is_active ? 'false' : 'true'})">
          ${u.is_active ? 'Deactivate' : 'Activate'}</button>
        <button class="danger" onclick="delUser('${jsEsc(u.id)}','${jsEsc(u.username)}',${u.recording_count})">Delete</button>
      </div></td>
    </tr>`).join('');

  const f = $('#filter');
  const keep = f.value;
  f.innerHTML = '<option value="">All users</option>' +
    users.map(u => `<option value="${u.id}">${esc(u.username)}</option>`).join('');
  f.value = keep;
}

$('#create').onclick = async () => {
  const msg = $('#cmsg');
  msg.className = 'msg';
  msg.textContent = '';
  try {
    const body = {
      username: $('#nu').value.trim(),
      full_name: $('#nf').value.trim(),
      email: $('#ne').value.trim(),
      password: $('#np').value,
      role: $('#nr').value
    };
    await api('/api/admin/users', { method: 'POST', body: JSON.stringify(body) });
    msg.className = 'msg ok';
    msg.textContent = `Created ${body.username}.`;
    ['#nu', '#nf', '#ne', '#np'].forEach(s => $(s).value = '');
    loadUsers();
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = e.message;
  }
};

async function resetPw(id, name) {
  const pw = prompt(`New password for ${name} (min 8 characters):`);
  if (!pw) return;
  try {
    await api(`/api/admin/users/${id}/password`, {
      method: 'POST', body: JSON.stringify({ password: pw })
    });
    alert('Password updated.');
  } catch (e) { alert(e.message); }
}

async function toggle(id, active) {
  try {
    await api(`/api/admin/users/${id}/active`, {
      method: 'POST', body: JSON.stringify({ is_active: active })
    });
    loadUsers();
  } catch (e) { alert(e.message); }
}

async function delUser(id, name, recs) {
  if (!confirm(`Delete ${name} and their ${recs} recording(s)? This cannot be undone.`)) return;
  try {
    await api(`/api/admin/users/${id}`, { method: 'DELETE' });
    loadUsers();
    loadRecs();
  } catch (e) { alert(e.message); }
}

async function loadRecs() {
  const uid = $('#filter').value;
  const rows = await api('/api/recordings' + recQuery());
  if (!rows.length) {
    $('#rbody').innerHTML =
      '<tr><td colspan="6"><div class="empty">No recordings yet.</div></td></tr>';
    return;
  }
  $('#rbody').innerHTML = rows.map(r => `
    <tr>
      <td style="font-size:13px">${fmtDate(r.started_at)}</td>
      <td>${esc(r.username)}</td>
      <td>${fmtDur(r.duration)}</td>
      <td>${r.turn_count}</td>
      <td class="preview">${esc(r.preview) || '—'}</td>
      <td><div class="row-actions">
        <button onclick="dl('${jsEsc(r.id)}','txt')">Transcript</button>
        <button onclick="dl('${jsEsc(r.id)}','wav')">Audio</button>
        <button class="danger" onclick="delRec('${jsEsc(r.id)}')">Delete</button>
      </div></td>
    </tr>`).join('');
}

// Downloads go through fetch so the Authorization header is sent -
// a plain link would hit the endpoint unauthenticated.
async function dl(id, kind) {
  try {
    if (kind === 'txt') {
      const d = await api(`/api/recordings/${id}/transcript`);
      save(new Blob([d.text], { type: 'text/plain' }), `${id}.txt`);
    } else {
      const r = await fetch(`/api/recordings/${id}/audio`,
        { headers: { 'Authorization': 'Bearer ' + token } });
      if (!r.ok) throw new Error('Download failed');
      save(await r.blob(), `${id}.wav`);
    }
  } catch (e) { alert(e.message); }
}

function save(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

async function delRec(id) {
  if (!confirm('Delete this recording?')) return;
  try { await api(`/api/recordings/${id}`, { method: 'DELETE' }); loadRecs(); loadUsers(); }
  catch (e) { alert(e.message); }
}

function recQuery() {
  const p = new URLSearchParams();
  const uid = $('#filter').value;
  const from = $('#from').value;
  const to = $('#to').value;
  if (uid) p.set('user_id', uid);
  if (from) p.set('date_from', from);
  if (to) p.set('date_to', to);
  const q = p.toString();
  return q ? '?' + q : '';
}

function clearFilters() {
  $('#filter').value = '';
  $('#from').value = '';
  $('#to').value = '';
  loadRecs();
}

$('#filter').onchange = loadRecs;
$('#from').onchange = loadRecs;
$('#to').onchange = loadRecs;

$('#tabUsers').onclick = () => {
  $('#paneUsers').hidden = false; $('#paneRecs').hidden = true;
  $('#tabUsers').classList.add('on'); $('#tabRecs').classList.remove('on');
  loadUsers();
};
$('#tabRecs').onclick = () => {
  $('#paneUsers').hidden = true; $('#paneRecs').hidden = false;
  $('#tabRecs').classList.add('on'); $('#tabUsers').classList.remove('on');
  loadRecs();
};

// Sidebar's "All Recordings" link (visible on every page, not just here)
// deep-links in via ?tab=recordings so it lands on the same pane a direct
// #tabRecs click would - reusing that handler rather than duplicating it.
if (new URLSearchParams(location.search).get('tab') === 'recordings') {
  $('#tabRecs').click();
} else {
  loadUsers();
}
</script>
<script src="/static/header.js"></script>
<script src="/static/sidebar.js"></script>
<script src="/static/upload.js"></script>
</body>
</html>
